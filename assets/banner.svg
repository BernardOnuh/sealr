<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Sealr</title>
  <desc id="d">Chat, files and money, sealed with post-quantum cryptography on QoreChain.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BE6CB"/>
      <stop offset="1" stop-color="#1FAE93"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2fd3b1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2fd3b1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="22" fill="#0b0e0f"/>
  <rect width="1280" height="420" rx="22" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="22" fill="url(#glow)"/>

  <!-- seal mark, with orbiting key rings -->
  <g transform="translate(1010 210)">
    <circle r="150" fill="none" stroke="#5BE6CB" stroke-opacity="0.10" stroke-width="2" stroke-dasharray="4 10"/>
    <circle r="118" fill="none" stroke="#5BE6CB" stroke-opacity="0.16" stroke-width="2"/>
    <circle r="82" fill="none" stroke="url(#g)" stroke-width="18"/>
    <circle cy="-17" r="22" fill="#fff"/>
    <path d="M-12 -6L-19 44h38l-7-50z" fill="#fff"/>
    <circle cx="118" cy="0" r="6" fill="#5BE6CB"/>
    <circle cx="-84" cy="-83" r="5" fill="#5BE6CB" fill-opacity="0.7"/>
    <circle cx="-30" cy="146" r="4" fill="#5BE6CB" fill-opacity="0.5"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="160" fill="#f3f5f4" font-size="104" font-weight="750" letter-spacing="-3">Sealr</text>
    <text x="84" y="214" fill="#f3f5f4" font-size="32" font-weight="600">Chat, files and money. Sealed for after Q-Day.</text>
    <text x="84" y="256" fill="#93a19d" font-size="20">Post-quantum messaging and a hybrid-signed wallet on QoreChain.</text>
    <text x="84" y="284" fill="#93a19d" font-size="20">What's recorded today stays unreadable tomorrow.</text>

    <g font-size="15" font-weight="600">
      <rect x="84" y="320" width="122" height="32" rx="16" fill="#5BE6CB" fill-opacity="0.12" stroke="#5BE6CB" stroke-opacity="0.45"/>
      <text x="145" y="341" fill="#7ff0da" text-anchor="middle">ML-KEM-1024</text>
      <rect x="218" y="320" width="112" height="32" rx="16" fill="#5BE6CB" fill-opacity="0.12" stroke="#5BE6CB" stroke-opacity="0.45"/>
      <text x="274" y="341" fill="#7ff0da" text-anchor="middle">ML-DSA-87</text>
      <rect x="342" y="320" width="176" height="32" rx="16" fill="#5BE6CB" fill-opacity="0.12" stroke="#5BE6CB" stroke-opacity="0.45"/>
      <text x="430" y="341" fill="#7ff0da" text-anchor="middle">Hybrid-signed txs</text>
      <rect x="530" y="320" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="605" y="341" fill="#c9d2cf" text-anchor="middle">QoreChain testnet</text>
    </g>
  </g>
</svg>
